<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tailored CV — DraftApply</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 9.5pt;
      line-height: 1.32;
      color: #1f2937;
      background: #e5e7eb;
    }

    /* ── Toolbar (screen only) ── */
    #toolbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #1e293b;
      color: white;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      z-index: 999;
      box-shadow: 0 8px 24px rgba(15,23,42,0.18);
    }
    #toolbar-title { flex: 1; font-weight: 600; }
    #toolbar button {
      background: rgba(255,255,255,0.15);
      border: 1.5px solid rgba(255,255,255,0.35);
      color: white;
      padding: 6px 18px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    #toolbar button:hover { background: rgba(255,255,255,0.28); }
    #toolbar button.btn-close {
      background: transparent;
      border-color: rgba(255,255,255,0.25);
      opacity: 0.8;
    }
    #toolbar button.btn-close:hover { opacity: 1; }

    /* ── CV page wrapper ── */
    #cv-page {
      margin: 62px auto 48px;
      max-width: 840px;
      background: white;
      box-shadow: 0 4px 32px rgba(0,0,0,0.12);
      padding: 16mm 18mm 18mm;
      min-height: 297mm;
    }

    /* Clean, single-column and ATS-safe: hierarchy comes from weight and
       spacing rather than decorative type or oversized headings. */

    /* Name — centered, large, spaced caps */
    .cv-name {
      font-size: 15pt;
      font-weight: 700;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #111827;
      margin-bottom: 2px;
    }

    /* Professional headline — centered and restrained */
    .cv-headline {
      font-size: 9.5pt;
      font-style: normal;
      font-weight: 600;
      text-align: center;
      color: #374151;
      margin-bottom: 3px;
    }

    /* Contact line — centered, subdued */
    .cv-contact {
      font-size: 8.5pt;
      text-align: center;
      color: #4b5563;
      line-height: 1.3;
    }
    .cv-contact a {
      color: #1a1a1a;
      text-decoration: none;
      border-bottom: 1px solid #ccc;
    }
    .cv-contact a:hover { border-color: #555; }

    /* Horizontal rule after header block */
    .cv-header-rule {
      border: none;
      border-top: 1px solid #374151;
      margin: 6px 0 0;
    }

    /* Section heading — ALL CAPS bold with full underline */
    .cv-section-header {
      font-size: 9pt;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #111827;
      border-bottom: 1px solid #6b7280;
      padding-bottom: 2px;
      margin-top: 10px;
      margin-bottom: 4px;
    }

    /* Entry: company (left) + dates (right) on one row */
    .cv-entry-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 6px;
    }
    .cv-company {
      font-size: 9.8pt;
      font-weight: 700;
      color: #111827;
      min-width: 0;
    }
    .cv-entry-dates {
      font-size: 8.5pt;
      color: #4b5563;
      white-space: nowrap;
      margin-left: 12px;
      flex-shrink: 0;
    }

    /* Job title / degree — below company row */
    .cv-job-title {
      font-size: 9.3pt;
      font-style: normal;
      font-weight: 600;
      color: #374151;
      margin: 1px 0 2px;
    }
    .cv-role-focus {
      font-size: 8.8pt;
      font-style: normal;
      color: #4b5563;
      margin: 0 0 3px;
    }

    /* Bullet list */
    .cv-bullets {
      padding-left: 16px;
      margin: 1px 0 2px;
    }
    .cv-bullets li {
      font-size: 9.2pt;
      line-height: 1.28;
      margin-bottom: 1.5px;
    }
    .cv-bullets li a { color: #111; text-decoration: underline; }

    .cv-skill-row {
      font-size: 9.2pt;
      line-height: 1.28;
      margin-bottom: 2px;
      color: #111;
    }
    .cv-skill-row strong { font-weight: 700; }

    /* Body paragraph (summaries, skills lists, etc.) */
    .cv-body {
      font-size: 9.3pt;
      line-height: 1.32;
      margin-bottom: 2px;
      color: #111;
    }
    .cv-body a { color: #111; text-decoration: underline; }

    /* Generic date-only line (fallback) */
    .cv-date-line {
      font-size: 8.5pt;
      color: #555;
      margin-bottom: 2px;
    }

    .cv-spacer { height: 3px; }

    /* Loading */
    #loading {
      text-align: center;
      margin-top: 120px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #64748b;
      font-size: 14px;
    }

    /* ── Print ── */

    /* @page margin is the only thing Chrome repeats on EVERY printed page.
       #cv-page's own padding is a single continuous box split across pages
       by pagination, so it only ever supplies spacing at the very top of
       page 1 and the very bottom of the last page — any page break in
       between lands content flush against the physical edge with no
       breathing room. Real @page margins fix that for every page; #cv-page
       carries no padding of its own in print so the two don't stack.
       Capped at 8mm (tested empirically): Chrome reserves the @page margin
       band to draw its own injected date/title/URL header and page-number
       footer once the margin is large enough to fit that text (observed
       threshold ~9mm) - a margin below that draws nothing there, which is
       what let @page{margin:0} suppress it before. 8mm is the largest value
       that stays under that threshold while still giving every page real,
       consistent breathing room. */
    @page { margin: 8mm; }

    /* Keep each experience/education entry together — no mid-entry page breaks */
    .cv-entry { break-inside: avoid; }

    @media print {
      body { background: white; }
      #toolbar { display: none !important; }
      #cv-page {
        margin: 0;
        box-shadow: none;
        padding: 0;
        min-height: auto;
      }
      .cv-entry { break-inside: avoid; }
      .cv-entry-row { break-after: avoid; }
      .cv-job-title { break-before: avoid; break-after: avoid; }
      .cv-role-focus { break-before: avoid; break-after: avoid; }
      .cv-bullets { break-before: avoid; }
      .cv-bullets li { break-inside: avoid; }
      .cv-section-header { break-after: avoid; }
    }
  </style>
</head>
<body>

  <div id="toolbar">
    <span id="toolbar-title">DraftApply — Tailored CV</span>
    <button id="print-btn">Save as PDF / Print</button>
    <button id="word-btn">Download Word (.docx)</button>
    <button class="btn-close" id="close-btn">Close</button>
  </div>

  <div id="cv-page">
    <div id="loading">Loading your tailored CV…</div>
    <div id="cv-content" hidden></div>
  </div>

  <script src="vendor/docx.iife.js"></script>
  <script src="tailored-document.js"></script>
  <script src="cv-export.js"></script>
</body>
</html>
