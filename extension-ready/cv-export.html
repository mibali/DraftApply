<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tailored CV — DraftApply</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Calibri', 'Georgia', serif;
      font-size: 11pt;
      line-height: 1.5;
      color: #111;
      background: #e5e7eb;
    }

    /* ── Toolbar (screen only) ── */
    #toolbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      z-index: 999;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    #toolbar-title { flex: 1; font-weight: 600; }
    #toolbar button {
      background: rgba(255,255,255,0.15);
      border: 1.5px solid rgba(255,255,255,0.35);
      color: white;
      padding: 6px 18px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    #toolbar button:hover { background: rgba(255,255,255,0.28); }
    #toolbar button.btn-close {
      background: transparent;
      border-color: rgba(255,255,255,0.25);
      opacity: 0.8;
    }
    #toolbar button.btn-close:hover { opacity: 1; }

    /* ── CV page wrapper ── */
    #cv-page {
      margin: 62px auto 48px;
      max-width: 840px;
      background: white;
      box-shadow: 0 4px 32px rgba(0,0,0,0.12);
      padding: 25mm 22mm 28mm;
      min-height: 297mm;
    }

    /* ══════════════════════════════════
       HARVARD CV TEMPLATE
    ══════════════════════════════════ */

    /* Name — centered, large, spaced caps */
    .cv-name {
      font-size: 18pt;
      font-weight: 700;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #0a0a0a;
      margin-bottom: 5px;
    }

    /* Professional headline — centered italic */
    .cv-headline {
      font-size: 11pt;
      font-style: italic;
      text-align: center;
      color: #444;
      margin-bottom: 3px;
    }

    /* Contact line — centered, subdued */
    .cv-contact {
      font-size: 9.5pt;
      text-align: center;
      color: #555;
      line-height: 1.6;
    }
    .cv-contact a {
      color: #1a1a1a;
      text-decoration: none;
      border-bottom: 1px solid #ccc;
    }
    .cv-contact a:hover { border-color: #555; }

    /* Horizontal rule after header block */
    .cv-header-rule {
      border: none;
      border-top: 1.5px solid #0a0a0a;
      margin: 10px 0 0;
    }

    /* Section heading — ALL CAPS bold with full underline */
    .cv-section-header {
      font-size: 10pt;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #0a0a0a;
      border-bottom: 2px solid #0a0a0a;
      padding-bottom: 2px;
      margin-top: 16px;
      margin-bottom: 7px;
    }

    /* Entry: company (left) + dates (right) on one row */
    .cv-entry-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 9px;
    }
    .cv-company {
      font-size: 11.6pt;
      font-weight: 800;
      color: #0a0a0a;
    }
    .cv-entry-dates {
      font-size: 9.5pt;
      color: #444;
      white-space: nowrap;
      margin-left: 12px;
      flex-shrink: 0;
    }

    /* Job title / degree — italic, below company row */
    .cv-job-title {
      font-size: 10.5pt;
      font-style: italic;
      font-weight: 600;
      color: #333;
      margin-bottom: 3px;
    }
    .cv-role-focus {
      font-size: 10pt;
      font-style: italic;
      color: #4b5563;
      margin: -1px 0 5px;
    }

    /* Bullet list */
    .cv-bullets {
      padding-left: 18px;
      margin: 4px 0 4px;
    }
    .cv-bullets li {
      font-size: 10.5pt;
      line-height: 1.5;
      margin-bottom: 2px;
    }
    .cv-bullets li a { color: #111; text-decoration: underline; }

    /* Body paragraph (summaries, skills lists, etc.) */
    .cv-body {
      font-size: 10.5pt;
      line-height: 1.55;
      margin-bottom: 3px;
      color: #111;
    }
    .cv-body a { color: #111; text-decoration: underline; }

    /* Generic date-only line (fallback) */
    .cv-date-line {
      font-size: 9.5pt;
      color: #555;
      margin-bottom: 2px;
    }

    .cv-spacer { height: 4px; }

    /* Loading */
    #loading {
      text-align: center;
      margin-top: 120px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #64748b;
      font-size: 14px;
    }

    /* ── Print ── */

    /* Suppress browser-injected date / title / URL headers and footers.
       Chrome only adds those when no @page margin is set via CSS. */
    @page { margin: 0; }

    /* Keep each experience/education entry together — no mid-entry page breaks */
    .cv-entry { break-inside: avoid; }

    @media print {
      body { background: white; }
      #toolbar { display: none !important; }
      #cv-page {
        margin: 0;
        box-shadow: none;
        padding: 20mm 18mm;
        min-height: auto;
      }
      .cv-entry { break-inside: avoid; }
      .cv-entry-row { break-after: avoid; }
      .cv-job-title { break-before: avoid; break-after: avoid; }
      .cv-role-focus { break-before: avoid; break-after: avoid; }
      .cv-bullets { break-before: avoid; }
      .cv-bullets li { break-inside: avoid; }
      .cv-section-header { break-after: avoid; }
    }
  </style>
</head>
<body>

  <div id="toolbar">
    <span id="toolbar-title">DraftApply — Harvard CV</span>
    <button id="print-btn">Save as PDF / Print</button>
    <button id="word-btn">Download Word (.doc)</button>
    <button class="btn-close" id="close-btn">Close</button>
  </div>

  <div id="cv-page">
    <div id="loading">Loading your tailored CV…</div>
    <div id="cv-content" hidden></div>
  </div>

  <script src="cv-export.js"></script>
</body>
</html>
