name: Domain Pack Refresh

on:
  schedule:
    - cron: '18 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Refresh domain knowledge snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install render-proxy dependencies
        run: npm ci --prefix render-proxy

      - name: Refresh domain packs
        env:
          DOMAIN_PACK_FETCH_REMOTE: 'true'
          DOMAIN_PACK_MAX_REMOTE_BYTES: '5000000'
        run: npm run refresh:domain-packs

      - name: Validate refreshed snapshot
        run: npm test

      - name: Open pull request when snapshot changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- shared/domain-packs/domain-pack.snapshot.json; then
            echo "Domain pack snapshot unchanged."
            exit 0
          fi

          branch="domain-packs/refresh-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add shared/domain-packs/domain-pack.snapshot.json
          git commit -m "Refresh domain knowledge snapshot"
          git push origin "$branch"
          gh pr create \
            --title "Refresh domain knowledge snapshot" \
            --body "Automated refresh for DraftApply domain pack metadata. Review source attribution, checksums, and generated profile changes before merge." \
            --base main \
            --head "$branch"
