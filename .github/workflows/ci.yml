name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # render-proxy/ is its own npm package (separate package.json and
      # lockfile) - the root install above never touches it, but
      # tests/proxy-routes.integration.test.js and
      # tests/redis-safety.integration.test.js import render-proxy/server.js
      # directly, which needs its own node_modules (express, redis, ...) at
      # runtime.
      - name: Install render-proxy dependencies
        run: npm ci --prefix render-proxy

      - name: Install Redis for safety integration tests
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Run unit tests
        run: npm test

  lint:
    name: Extension manifest lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate manifest.json
        run: |
          node -e "
            const fs   = require('fs');
            const path = require('path');
            const raw  = fs.readFileSync(path.join('extension-ready', 'manifest.json'), 'utf8');
            const m    = JSON.parse(raw);
            const required = ['manifest_version', 'name', 'version', 'permissions'];
            for (const key of required) {
              if (!(key in m)) { console.error('Missing field:', key); process.exit(1); }
            }
            if (m.manifest_version !== 3) {
              console.error('Expected manifest_version 3, got', m.manifest_version);
              process.exit(1);
            }
            console.log('manifest.json is valid (MV3)');
          "

      - name: Check JS syntax (shared modules)
        working-directory: shared
        run: |
          node --input-type=module < jd-parser.js      && echo "jd-parser.js OK"
          node --input-type=module < cv-tailor.js      && echo "cv-tailor.js OK"
          node --input-type=module < cv-parser.js      && echo "cv-parser.js OK"
          node --input-type=module < prompt-builder.js && echo "prompt-builder.js OK"
          node --input-type=module < answer-generator.js && echo "answer-generator.js OK"

  browser:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      # MV3 extensions require headed Chromium; xvfb supplies the CI display.
      - name: Run browser smoke tests
        run: xvfb-run --auto-servernum npm run test:browser
