name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

  lint:
    name: Extension manifest lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate manifest.json
        run: |
          node -e "
            const fs   = require('fs');
            const path = require('path');
            const raw  = fs.readFileSync(path.join('extension-ready', 'manifest.json'), 'utf8');
            const m    = JSON.parse(raw);
            const required = ['manifest_version', 'name', 'version', 'permissions'];
            for (const key of required) {
              if (!(key in m)) { console.error('Missing field:', key); process.exit(1); }
            }
            if (m.manifest_version !== 3) {
              console.error('Expected manifest_version 3, got', m.manifest_version);
              process.exit(1);
            }
            console.log('manifest.json is valid (MV3)');
          "

      - name: Check JS syntax (shared modules)
        run: |
          node --input-type=module < shared/jd-parser.js   && echo "jd-parser.js OK"
          node --input-type=module < shared/cv-tailor.js   && echo "cv-tailor.js OK"
          node --input-type=module < shared/cv-parser.js   && echo "cv-parser.js OK"
          node --input-type=module < shared/prompt-builder.js && echo "prompt-builder.js OK"
          node --input-type=module < shared/answer-generator.js && echo "answer-generator.js OK"
