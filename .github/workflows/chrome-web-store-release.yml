name: Chrome Web Store release

on:
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: 'Submit uploaded package for Chrome Web Store review'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Package and upload extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # render-proxy/ is its own npm package (separate package.json and
      # lockfile) - the root install above never touches it, but
      # `npm run release:chrome` runs the full test suite as a gate, which
      # includes tests/proxy-routes.integration.test.js importing
      # render-proxy/server.js directly. Same gap as ci.yml's Tests job.
      - name: Install render-proxy dependencies
        run: npm ci --prefix render-proxy

      - name: Package extension
        run: npm run release:chrome

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: draftapply-chrome-package
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

      - name: Upload to Chrome Web Store
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.submit_for_review == 'false'
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: npm run release:chrome:upload

      - name: Upload and submit to Chrome Web Store
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.submit_for_review == 'true')
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: npm run release:chrome:publish
